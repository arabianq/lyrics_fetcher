[package]
name = "lyrics_fetcher"
version = "1.1.1"
edition = "2024"
authors = ["arabianq"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/arabianq/lyrics_fetcher"
homepage = "https://github.com/arabianq/lyrics_fetcher"
keywords = ["lyrics", "music", "audio", "lrclib", "genius"]
description = "A Rust for fetching and embedding lyrics into audio files using multiple sources."

[dependencies]
tokio = { version = "1.51.0", features = ["full"] }
futures = "0.3.32"
async-walkdir = "2.1.0"
async-trait = "0.1.89"

clap = { version = "4.6.0", features = ["derive"] }
anyhow = "1.0.102"
itertools = "0.14.0"
dotenv = "0.15.0"

lofty = "0.25.0"
id3 = "1.16.4"
reqwest = { version = "0.13.2", default-features = false, features = [
    "rustls",
    "json",
    "query",
] }
serde = { version = "1.0.228", features = ["derive"] }
scraper = "0.26.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
