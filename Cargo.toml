[package]
name = "lyrics_fetcher"
version = "1.1.1"
edition = "2024"
authors = ["arabianq"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/arabianq/lyrics_fetcher"
homepage = "https://github.com/arabianq/lyrics_fetcher"
keywords = ["lyrics", "music", "audio", "lrclib", "genius"]
description = "A command-line tool for fetching and embedding lyrics into audio files using multiple sources."

[dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
async-walkdir = "2.2.0"
async-trait = "0.1.92"

clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
dotenvy = "0.15.7"

lofty = "0.25.5"
id3 = "1.17.3"
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "json",
    "query",
] }
serde = { version = "1.0.229", features = ["derive"] }
scraper = "0.26.0"
roxmltree = "0.21"
serde_yaml_ng = "0.10"
regex = "1"
base64 = "0.23"
flate2 = "1"
serde_json = "1"
tempfile = "3"
sha2 = "0.11"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
