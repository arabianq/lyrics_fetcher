[package]
name = "lyrics_fetcher"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.51.0", features = ["full"] }
futures = "0.3.32"
async-walkdir = "2.1.0"
async-trait = "0.1.89"

clap = { version = "4.6.0", features = ["derive"] }
anyhow = "1.0.102"
itertools = "0.14.0"

id3 = { version = "1.16.4", default-features = false, features = ["tokio"] }
reqwest = { version = "0.13.2", default-features = false, features = [
    "rustls",
    "json",
    "query"
] }
serde = { version = "1.0.228", features = ["derive"] }
scraper = "0.26.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
